# Formatting, lint, typecheck, tests, both builds (server-rendered and the static GitHub Pages site) and browser
# checks of the latter. Runs on pull requests; on main, the Pages workflow calls it and deploys the site it built,
# so a push builds once.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the Pages site as the artifact to deploy.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes the run in progress; a run gating a deploy is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Reads the pnpm version pinned in package.json's packageManager. Third-party: pinned to a commit.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:pages
      # Every screen of the built site in Chromium: each texture has its image, every file loads (e2e/).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
