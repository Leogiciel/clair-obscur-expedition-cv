# Builds the static site (every screen prerendered) and publishes it on GitHub Pages at each push to main, once the
# checks (ci.yml) pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily: the level's XP bar counts the days since the last birthday, so the prerendered pages go stale overnight.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  # A deployment is never interrupted halfway; a newer one waits for it.
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'
      # The prerendered pages sit under the base path; Pages serves the artifact at that path already. Unknown URLs
      # fall back to the client app.
      - run: |
          mkdir site
          cp -R build/client/clair-obscur-expedition-cv/. site/
          rm -rf build/client/clair-obscur-expedition-cv
          cp -R build/client/. site/
          cp site/__spa-fallback.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
