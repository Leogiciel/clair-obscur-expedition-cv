# Builds the static site (every screen prerendered) and publishes it on GitHub Pages at each push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily: the level's XP bar counts the days since the last birthday, so the prerendered pages go stale overnight.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'
      # The prerendered pages sit under the base path; Pages serves the artifact at that path already. Unknown URLs
      # fall back to the client app.
      - run: |
          mkdir site
          cp -R build/client/clair-obscur-expedition-cv/. site/
          rm -rf build/client/clair-obscur-expedition-cv
          cp -R build/client/. site/
          cp site/__spa-fallback.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
