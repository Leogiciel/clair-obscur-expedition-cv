# Publishes the static site (every screen prerendered) on GitHub Pages at each push to main, once the checks pass:
# ci.yml builds it alongside them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily: the level's XP bar counts the days since the last birthday, so the prerendered pages go stale overnight.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  # A deployment is never interrupted halfway; a newer one waits for it.
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      upload-pages: true

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
